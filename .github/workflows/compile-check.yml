name: Android compile check

# 目的：在没有 Android 构建环境的机器（iSH 上 JVM 因 getcpu ENOSYS 无法启动）上，
# 借 GitHub 的 runner 做真实编译验证。
#
# 用法：手动触发（workflow_dispatch），或对 fix/** 分支与 PR 自动跑。
# 只看 Kotlin 编译（不跑测试、不打 apk），最快拿到类型错误。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

jobs:
  compile-debug-kotlin:
    name: :app:compileDebugKotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compile Kotlin (debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace --console=plain

      - name: Collect build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            build/reports/**
