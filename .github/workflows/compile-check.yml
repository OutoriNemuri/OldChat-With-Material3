name: Android build check

# 目的：在没有 Android 构建环境的机器（iSH 上 JVM 因 getcpu ENOSYS 无法启动）上，
# 借 GitHub 的 runner 做真实编译验证。
#
# 用法：手动触发（workflow_dispatch），或对 fix/** 分支与 PR 自动跑。
# 三段验证：
#   1. :app:compileDebugKotlin —— Kotlin 类型检查（最快拿到类型错误）
#   2. :app:assembleDebug     —— 资源/AndroidManifest 打包（FileProvider、xml、drawable 等）
#   3. :app:assembleRelease   —— R8 混淆 + 未签名 release（检验 proguard 规则收窄后的可用性）
# 不跑单元测试/仪器测试。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

jobs:
  compile-debug-kotlin:
    name: :app:compileDebugKotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不再用 android-actions/setup-android@v3：它内部执行 `sdkmanager tools`，
      # 而该包在仓库元数据里已不存在 → `Failed to find package 'tools'` 直接整步失败
      # （2026-09-15 实测，与项目代码无关）。ubuntu-latest 镜像本来就带 Android SDK
      # （ANDROID_HOME=/usr/local/lib/android/sdk），直接用它的 sdkmanager 装缺失包即可。
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER" || { echo "未找到 sdkmanager"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "SDK 就绪："
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compile Kotlin (debug)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace --console=plain

      - name: Assemble debug APK (resources + manifest)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Assemble release APK (R8 / ProGuard rules)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain

      # 用真 JVM 跑一遍 BC 的 ML-KEM-768：验证 API 可用 + 长度与 enigmaj 抓包一致。
      # 这一步是「加密通话为什么会静默降级 P-256」的回归测试（详见 tools/kem_check/KemCheck.java）。
      # 手动触发（workflow_dispatch）时才校验 ML-KEM；日常推送跳过（已验证过，省时间）
      - name: Verify BouncyCastle ML-KEM-768 API
        if: github.event_name == 'workflow_dispatch'
        run: |
          # 从版本目录取 BC 版本，避免 find 命中 Gradle 缓存里的旧版本 jar
          BCVER=$(sed -n 's/.*bcprov-jdk18on.*version = "\([^"]*\)".*/\1/p' gradle/libs.versions.toml | head -1)
          JAR=$(find ~/.gradle/caches -name "bcprov-jdk18on-${BCVER}.jar" | head -1)
          echo "catalog BC version: $BCVER"
          echo "BC jar: $JAR"
          test -n "$JAR" || { echo "未找到 bcprov-jdk18on-${BCVER}.jar"; exit 1; }
          mkdir -p /tmp/kemcheck
          javac -cp "$JAR" -d /tmp/kemcheck .github/kem_check/KemCheck.java
          java -cp "$JAR:/tmp/kemcheck" KemCheck

      - name: Show APK outputs
        if: success()
        run: find app/build/outputs -name '*.apk' -exec ls -lh {} \;

      # 真机验证用：debug APK 用 CI 自动生成的 debug 签名，可直接安装。
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Collect build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            build/reports/**
